# Deploy — builds the OpenNext Worker and ships it to Cloudflare
# (translate.sundaysuite.app). Mirrors the manual flow in CLAUDE.md.
#
# Requires repo configuration (Settings → Secrets and variables → Actions):
#   secret CLOUDFLARE_API_TOKEN         "Edit Cloudflare Workers" template
#   secret CLOUDFLARE_ACCOUNT_ID        Cloudflare dashboard overview page
#   secret NEXT_PUBLIC_SUPABASE_ANON_KEY  public-by-design, inlined into the
#                                         client bundle at build (realtime,
#                                         presence, captions need it)
#
# Worker runtime secrets (SUPABASE_SERVICE_ROLE_KEY, CF_REALTIME_*,
# ANTHROPIC_API_KEY) live in the Worker itself via `wrangler secret put` and
# survive deploys — this workflow never touches them.
#
# Triggers: pushes to the current feature branch (remove that trigger when the
# branch merges) and manual dispatch (works once this file is on main).
name: deploy
on:
  workflow_dispatch:
  push:
    branches: [claude/translate-improvements-b4sroh]

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rkiahljrkormwzogghpc.supabase.co
      NEXT_PUBLIC_BASE_URL: https://translate.sundaysuite.app
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check required configuration
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run cf:build
      - name: Deploy to Cloudflare
        run: npx opennextjs-cloudflare deploy
      - name: Verify live health
        run: |
          sleep 5
          curl -sf https://translate.sundaysuite.app/api/health
